rag:
  top_k: 4
  chunk_size: 800
  chunk_overlap: 120
vector_store:
  collection: "normativa"        # ChromaDB collection that holds the indexed law
  path: "chroma_db"              # persistence dir (overridable with CHROMA_PATH env)
llm:
  max_tokens: 1024
  temperature: 0.0
inputs:
  ontology: "data/input/ontopriv.rdf"        # OntoPriv exported from Protégé (RDF/XML) — seed for the core
  legal_text: "data/input/lopdp.pdf"         # LOPDP or another law (.txt or .pdf)
  dpv: "vocab/dpv.ttl"                        # DPV 2.3 (Turtle), downloaded locally
interim:
  ontology_rdfxml: "data/interim/ontopriv.rdf"   # normalized RDF/XML (feeds later stages)
alignment:
  top_k: 3                    # DPV candidates kept per concept (no threshold: the human decides)
  weight_lexical: 0.4         # weight of the name similarity (rapidfuzz, S4-T04)
  weight_semantic: 0.6        # weight of the meaning similarity (embeddings, S4-T05)
  duplicate_threshold: 0.75   # AI concept marked "possible duplicate" of OntoPriv at/above this (S4-T06, provisional)
  duplicate_name_match: 0.95  # ...or when an OntoPriv entity has (almost) the same name (S4-T06)
  justify_batch_size: 15      # concepts per LLM call when the AI proposes the SKOS type (S4-T08)
  justify_max_calls: 60       # LLM calls per run (~39 needed; gemini-3.1-flash-lite free tier: 500/day)
  justify_pause_seconds: 5    # pause between calls (free tier: 15 requests and 250K tokens per minute)
  justify_article_chars: 1200 # length of the law article sent as evidence
  justify_max_tokens: 8192    # max answer length per call
  reference_sample: "data/reference/alignment-reference-sample.csv"  # hand-labelled sample (S4-T09, tracked in git)
  reference_size: 30          # concepts in the sample
  reference_ai_share: 0.34    # share of AI-proposed concepts (~10 of 30); the rest are OntoPriv
  reference_seed: 42          # fixed seed: the same sample every time
review:
  source_id: "ontopriv+lopdp"                          # which input the decisions belong to (S5-T01); another law/ontology gets its own id
  decisions_file: "data/review/alignment-decisions.jsonl"  # human decisions log, append-only, tracked in git (S5-T01)
  reviewer: "Elian Gavilanes"                                    # default reviewer shown in the web; editable there
  proposals_file: "data/review/assistant-proposals.json"  # assistant proposals, NOT decisions: a person confirms them in the web (S5-T08)
workspaces:
  dir: "data/workspaces"      # one folder per user upload (S6-T04); ignored by git, never mixed with data/output
  max_upload_mb: 25           # larger uploads are refused with a message in Spanish
auto:
  threshold: 0.75             # S6-T06: rank-1 score needed for an automatic proposal; calibrated on the base (py -m src.alignment.calibrate): 82 % precision (28 of 34) with the AI filter. S7-T06: the rule WITHOUT AI (concepts the AI could not decide): rank 1 at or above it, untyped (rdfs:seeAlso)
  min_precision: 0.75         # the calibration picks the lowest threshold that reaches this precision (also the floor of the decider rule, S7-T05)
  use_llm: true               # S7-T06: the decider asks the LLM; false = only the cache and the rule without AI
  llm_max_calls: 20           # Sprint 6 proposer (S6-T09 check): AI calls per run, 15 concepts per call
decider:                      # S7-T03..T06: the alignment decider (retrieve -> decide with precedents -> fixed rule)
  candidate_source: hybrid    # where its DPV candidates come from: hybrid | dpv | dpv_rerank (chosen by py -m src.alignment.benchmark)
  candidates: 10              # DPV candidates it sees per concept (Sprint 6: only the best one)
  precedents: 4               # S7-T04: closest decided base concepts shown as precedents (collection "decisions")
  batch_size: 10              # concepts per LLM call
  max_calls: 60               # LLM calls per run (gemini-3.1-flash-lite free tier: 500/day); re-run to continue (cache)
  pause_seconds: 5            # pause between calls (free tier: 15 requests per minute)
  max_tokens: 8192            # max answer length per call
  article_chars: 1200         # length of the law article shown as evidence (S7-T05, S7-T11)
  rule:                       # S7-T05 (py -m src.alignment.decider_eval): second grid; on the base 75,0 % precision, 29,5 % coverage (cross-validation: 72,0 %)
    accept: [alta]            # LLM confidences that become an automatic answer
    min_score: 0.5            # minimum hybrid score of the chosen candidate
    relations: [skos:exactMatch, skos:closeMatch, skos:broadMatch, skos:narrowMatch]   # classes: every relation but relatedMatch
    property_relations: []    # concepts that are only properties: never automatic
    suggest: [alta]           # what the rule leaves out with these confidences is a "sugerida" (never written)
labels:                       # S7-T08: the LLM writes the missing es/en labels (glossary: the LOPDP terms kept in Sprint 5), module <name>-labels
  batch_size: 40              # concepts per LLM call (OntoPriv, 527 concepts: 14 calls)
  max_calls: 20               # LLM calls per run (free tier shared with the decider: 500/day); re-run to continue (cache)
  pause_seconds: 5            # pause between calls (free tier: 15 requests per minute)
  max_tokens: 4096            # max answer length per call
  definition_chars: 200       # length of the definition shown per concept
extraction:                   # S7-T09: the LLM extracts the concepts of an uploaded law (prompt extract.v2); a fixed rule accepts them (py -m src.core.acceptance)
  batch_size: 8               # articles per LLM call (GDPR, 99 articles: 13 calls)
  max_tokens: 8192            # max answer length per call (a definitions article gives dozens of concepts)
  pause_seconds: 5            # pause between calls (free tier: 15 requests per minute)
  max_calls: 30               # LLM calls per run; re-run to continue where it stopped